# Licensing per the REUSE specification (https://reuse.software). Check with `reuse lint`.
#
# The split, as the tools that use this system (D8, 14 Oct 2026):
#   CERN-OHL-S-2.0  the documentation
#   MPL-2.0         code: the tokens, the stylesheets, the component previews, the scripts,
#                   the tests, CI and tool configuration
#   fonts/          the FiraCode Nerd Font subsets: OFL-1.1, with Codicons (CC-BY-4.0) and
#                   Powerline (MIT) glyphs; the upstream texts and credits are in fonts/licenses/
#
# When several annotations match a file, the LAST matching one wins, so the general rule comes
# first and the narrower ones after it.
version = 1

[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 Alon A. Rabinowitz"
SPDX-License-Identifier = "CERN-OHL-S-2.0"

[[annotations]]
path = [
  ".claude/**",
  ".github/**",
  "components/**",
  "scripts/**",
  "tests/**",
  ".gitattributes",
  ".gitignore",
  "REUSE.toml",
  "pyproject.toml",
  "tokens.css",
  "tokens.json",
  "uv.lock",
]
SPDX-FileCopyrightText = "2026 Alon A. Rabinowitz"
SPDX-License-Identifier = "MPL-2.0"

[[annotations]]
path = "components/**/README.md"
SPDX-FileCopyrightText = "2026 Alon A. Rabinowitz"
SPDX-License-Identifier = "CERN-OHL-S-2.0"

[[annotations]]
path = ["fonts/*.woff2", "fonts/licenses/*.txt"]
SPDX-FileCopyrightText = [
  "2014-2021 The Fira Code Project Authors",
  "2014 Ryan L McIntyre",
  "Microsoft Corporation",
  "2024 Fonticons, Inc.",
  "2013 Kim Silkebækken and other contributors",
  "2016 Ryan L McIntyre",
]
SPDX-License-Identifier = "OFL-1.1 AND CC-BY-4.0 AND MIT"
