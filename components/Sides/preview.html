<!-- @dsCard group="Form" height=260 subtitle="Open or closed, side by side" -->
<div class="ws-text" style="max-width:30rem">
<div class="ws-caps">Sides (ticked = closed)</div>
<div class="ws-sides" role="group" aria-label="Closed sides">
<button class="ws-sides__btn ws-sides__top" type="button" aria-pressed="true">Top</button>
<button class="ws-sides__btn ws-sides__left" type="button" aria-pressed="false">Left</button>
<div class="ws-sides__board" aria-hidden="true"></div>
<button class="ws-sides__btn ws-sides__right" type="button" aria-pressed="false">Right</button>
<button class="ws-sides__btn ws-sides__bottom" type="button" aria-pressed="true">Bottom</button>
</div>
<p class="ws-note">Open sides keep the half slots so a neighbour can join.</p>
</div>
